# Deploy to GitHub Pages
# Builds the Angular app and deploys it to GitHub Pages.
# Requires: Settings > Pages > Source = "GitHub Actions"

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Check affected
        id: check
        run: |
          BASE="${{ github.event.before }}"
          [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] && BASE="HEAD~1"
          AFFECTED=$(pnpm nx show projects --affected -p web --base="$BASE" --head="${{ github.sha }}")
          [ -n "$AFFECTED" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] && echo "deploy=true" >> "$GITHUB_OUTPUT" || echo "deploy=false" >> "$GITHUB_OUTPUT"

      - name: Build Web Workers
        if: steps.check.outputs.deploy == 'true'
        run: pnpm nx run web:build-workers

      - name: Build for GitHub Pages
        if: steps.check.outputs.deploy == 'true'
        run: pnpm nx build web --configuration gh-pages

      - name: Copy index.html → 404.html (SPA routing fallback)
        if: steps.check.outputs.deploy == 'true'
        run: cp dist/angular-helpers/browser/index.html dist/angular-helpers/browser/404.html

      - name: Add .nojekyll (prevent Jekyll processing)
        if: steps.check.outputs.deploy == 'true'
        run: touch dist/angular-helpers/browser/.nojekyll

      - name: Upload Pages artifact
        if: steps.check.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/angular-helpers/browser

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
