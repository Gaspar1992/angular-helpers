# Release Workflow
# Triggered manually via workflow_dispatch or automatically when a package.json version changes on main.

name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - core
          - browser-web-apis
          - storage
          - security
          - worker-http
          - openlayers
          - testing
          - yjs
      dry_run:
        description: 'Dry run (simulate without publishing)'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'libs/**/package.json'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Build all packages in topological order
        run: pnpm run build:packages:prod

      - name: Strip workspace protocol from built packages dynamically
        run: |
          core_version=$(node -p "require('./libs/core/package.json').version")
          echo "Replacing workspace:* with ^$core_version"
          find dist -name "package.json" -exec sed -i "s/\"workspace:\*\"/\"^$core_version\"/g" {} +

      - name: Publish new versions to npm with Provenance
        run: node scripts/publish-packages.mjs
        env:
          TARGET_PACKAGE: ${{ github.event.inputs.package || 'all' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
